<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Shorty — Premium URL shortening with real-time analytics" />
    <title>Shorty</title>
    <script>
      (function () {
        var key = 'shorty_theme';
        var themes = ['royal-gold','navy-gold','emerald-gold','burgundy-gold','sapphire-gold','pearl-gold'];
        var stored = localStorage.getItem(key);
        document.documentElement.setAttribute('data-theme', themes.indexOf(stored) >= 0 ? stored : 'royal-gold');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
